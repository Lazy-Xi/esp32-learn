<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 网页</title>
  <style>
    body { margin: 0; padding: 24px; background: #f1f5f9; color: #0f172a;
           font-family: system-ui, sans-serif; }
    main { max-width: 560px; margin: 12vh auto; padding: 32px;
           background: white; border-radius: 16px; }
    h1 { margin-top: 0; }
    p { line-height: 1.8; }
    code { padding: 3px 6px; background: #e2e8f0; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>你好，ESP32！</h1>
    <p>Wi-Fi 已连接，HTTP 服务正在运行。</p>
    <p>这是 ESP32 返回的 HTML 页面。修改 <code>main/index.html</code> 后，重新编译并烧录即可更新内容。</p>
  </main>
</body>
</html>
